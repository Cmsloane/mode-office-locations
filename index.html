<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>MODE Global — Office Locations</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a22; --panel2:#1b212b; --line:#283041;
    --ink:#e8edf4; --muted:#8b97a8; --faint:#5d6878; --accent:#ff5c2b;
    --water:#0a0d12; --landstroke:#46566f; --border-int:#2c3850; --label:#8c9ab2;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden}
  .app{display:grid;grid-template-columns:380px 1fr;height:100vh}
  .side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .head{padding:20px 22px 16px;border-bottom:1px solid var(--line);position:relative}
  .head:before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,var(--accent),#ff8a5c 60%,transparent)}
  .brand{font-weight:800;font-size:20px;letter-spacing:-.4px;line-height:1.05;text-transform:uppercase}
  .brand small{display:block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:2.4px;color:var(--accent);margin-top:7px;text-transform:uppercase}
  .count{margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .count b{color:var(--ink)}
  .controls{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:11px}
  .search{position:relative}
  .search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px 11px 38px;color:var(--ink);font-size:14px;font-family:inherit;outline:none;transition:border .15s}
  .search input:focus{border-color:var(--accent)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .search input::placeholder{color:var(--faint)}
  select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-family:inherit;font-size:13px;outline:none;cursor:pointer}
  .lbl-mini{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);margin:2px 0 -2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.3px;padding:6px 10px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:all .12s}
  .chip:hover{border-color:var(--faint);color:var(--ink)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#0e1116}
  .list{flex:1;overflow-y:auto;min-height:0}
  .list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .item{padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;display:flex;gap:11px;align-items:flex-start}
  .item:hover{background:var(--panel2)}
  .item.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
  .pin{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;background:var(--accent);box-shadow:0 0 0 3px rgba(255,92,43,.15)}
  .it-main{flex:1;min-width:0}
  .it-name{font-size:13.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it-sub{font-size:11.5px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
  .it-modes{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
  .mtag{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.3px;padding:1.5px 5px;border-radius:4px;background:#23304a;color:#9fb4dd;text-transform:uppercase}
  .empty{padding:40px 20px;text-align:center;color:var(--faint);font-size:13px}
  .foot{padding:11px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
  .foot button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:.12s}
  .foot button:hover{border-color:var(--accent);color:var(--accent)}
  .mapwrap{position:relative;overflow:hidden}
  svg#map{width:100%;height:100%;display:block;background:radial-gradient(130% 130% at 50% -10%, #11161f 0%, var(--water) 72%);cursor:grab}
  svg#map:active{cursor:grabbing}
  .state{stroke:#2b3852;stroke-width:.5px;vector-effect:non-scaling-stroke;transition:fill .12s}
  .state.hl{stroke:var(--accent);stroke-width:1.6px}
  .natborder{fill:none;stroke:var(--landstroke);stroke-width:1px;vector-effect:non-scaling-stroke;pointer-events:none}
  .slabel{fill:var(--label);font-family:var(--mono);font-weight:600;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0a0d12;stroke-width:2.5px;stroke-linejoin:round}
  .office{fill:var(--accent);stroke:#0e1116;stroke-width:1.4px;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .1s}
  .office:hover{fill:#ffd0bd}
  .office.sel{fill:#fff;stroke:var(--accent);stroke-width:2px}
  .tooltip{position:absolute;pointer-events:none;background:rgba(10,13,18,.96);border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;transform:translate(-50%,-150%);opacity:0;transition:opacity .1s;z-index:600}
  .detail{position:absolute;top:14px;left:14px;z-index:500;width:300px;background:rgba(21,26,34,.97);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:13px;padding:16px 17px;box-shadow:0 12px 44px rgba(0,0,0,.5);opacity:0;transform:translateY(-6px);pointer-events:none;transition:.16s}
  .detail.show{opacity:1;transform:none;pointer-events:auto}
  .detail .x{position:absolute;top:11px;right:13px;color:var(--faint);cursor:pointer;font-size:16px;line-height:1}
  .detail .x:hover{color:var(--ink)}
  .pop-name{font-weight:800;font-size:15px;line-height:1.2;margin-bottom:3px;padding-right:18px}
  .pop-id{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.5px;margin-bottom:11px}
  .pop-row{display:flex;gap:8px;font-size:12.5px;margin:6px 0;line-height:1.35}
  .pop-row .lbl{color:var(--faint);font-family:var(--mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;flex:none;width:54px;padding-top:2px}
  .pop-row a{color:#5b9bff;text-decoration:none}
  .approx{font-size:9.5px;color:var(--faint);font-style:italic;margin-top:9px;font-family:var(--mono)}
  .topbtn{position:absolute;top:14px;right:14px;z-index:500;display:flex;gap:8px}
  .tb{background:rgba(21,26,34,.94);backdrop-filter:blur(8px);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 13px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:all .12s;text-transform:uppercase}
  .tb:hover{border-color:var(--accent);color:var(--accent)}
  .zoomctl{position:absolute;bottom:18px;right:18px;z-index:500;display:flex;flex-direction:column;gap:1px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .zoomctl button{width:38px;height:38px;background:rgba(21,26,34,.94);color:var(--ink);border:none;font-size:19px;cursor:pointer;font-family:var(--mono)}
  .zoomctl button:hover{background:var(--panel2);color:var(--accent)}
  .mlegend{position:absolute;bottom:18px;left:18px;z-index:500;background:rgba(10,13,18,.82);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .mlegend h4{margin:0 0 8px;font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;font-weight:600}
  .mlegend .scale{display:flex;align-items:center;gap:0}
  .mlegend .sw{width:26px;height:11px}
  .mlegend .ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:3px}
  .mlegend .note{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:7px}
  .mobile-toggle{display:none}
  @media(max-width:820px){
    html,body{overflow:hidden}
    /* stack: map on top, list+controls below — both visible at once */
    .app{display:flex;flex-direction:column;grid-template-columns:none;height:100vh;height:100dvh}
    .mapwrap{order:0;width:100%;height:42vh;height:42dvh;flex:0 0 auto;border-bottom:1px solid var(--line)}
    .side{order:1;width:100%;flex:1 1 auto;min-height:0;border-right:none;transform:none}
    .head{padding:12px 16px 10px}
    .brand{font-size:16px;letter-spacing:-.3px}
    .brand small{font-size:9px;letter-spacing:2px;margin-top:5px}
    .count{margin-top:9px;font-size:11px}
    .controls{padding:11px 14px;gap:9px}
    .search input{padding:10px 12px 10px 36px;font-size:13.5px}
    .chip{padding:5px 9px;font-size:10px}
    .list{flex:1 1 auto;min-height:60px}
    .item{padding:11px 16px}
    .mobile-toggle{display:none}
    .detail{top:12px;left:12px;right:12px;width:auto;max-width:360px}
    .mlegend{display:none}
    .zoomctl{bottom:12px;right:12px}
    .topbtn{top:10px;right:10px}
    .tb{padding:8px 11px;font-size:10px}
    .foot{padding:9px 14px;padding-bottom:calc(9px + env(safe-area-inset-bottom))}
  }
  @media(max-width:820px) and (max-height:680px){
    .mapwrap{height:38vh;height:38dvh}
  }

.analytics{border-top:1px solid var(--line);margin-top:13px;padding-top:12px}
.an-hdr{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.an-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:11px}
.an-kpi{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 5px;text-align:center}
.an-kpi-val{display:block;font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ink);line-height:1.1}
.an-kpi-lbl{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin-top:3px}
.an-kpi-val.good{color:#4ade80}.an-kpi-val.warn{color:#facc15}.an-kpi-val.bad{color:#f87171}
.an-lanes-hdr{font-family:var(--mono);font-size:8px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin:0 0 5px}
.an-lane{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:3.5px 0;border-bottom:1px solid var(--line)}
.an-lane:last-child{border-bottom:none}
.an-lane-cnt{font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:600}
.an-sparkline{margin:10px 0 2px}
.an-sparkline svg{display:block}
.an-loading{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:center;padding:10px 0;animation:an-pulse 1.4s ease-in-out infinite}
@keyframes an-pulse{0%,100%{opacity:.4}50%{opacity:1}}
.an-empty{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:center;padding:8px 0;font-style:italic}
.an-err{font-family:var(--mono);font-size:10px;color:#f87171;text-align:center;padding:8px 0}
.warn-dot{vector-effect:non-scaling-stroke;pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="head">
      <div class="brand">Office Locations<small>MODE Global · Network Directory</small></div>
      <div class="count"><b id="cShown">0</b> of <b id="cTotal">0</b> offices shown</div>
    </div>
    <div class="controls">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Search office, city, contact, ZIP&hellip;" autocomplete="off"/>
      </div>
      <select id="state"><option value="">All states / provinces</option></select>
      <div class="lbl-mini">Service mode</div>
      <div class="chips" id="modes">
        <button class="chip" data-m="LTL">LTL</button>
        <button class="chip" data-m="TL">TL</button>
        <button class="chip" data-m="IM">IM</button>
        <button class="chip" data-m="Air">Air</button>
        <button class="chip" data-m="Ocean">Ocean</button>
        <button class="chip" data-m="Warehousing">Warehousing</button>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="foot">
      <button id="csv">&#8595; Export CSV</button>
      <button id="reset2">Clear filters</button>
    </div>
  </aside>
  <div class="mapwrap" id="mapwrap">
    <div class="topbtn"><button class="tb" id="reset">Reset view</button></div>
    <svg id="map"><g id="layer"></g></svg>
    <div class="tooltip" id="tip"></div>
    <div class="detail" id="detail"></div>
    <div class="zoomctl"><button id="zin">+</button><button id="zout">&minus;</button></div>
    <div class="mlegend" id="mlegend">
      <h4>Offices per state</h4>
      <div class="scale" id="scaleSw"></div>
      <div class="ends"><span>0</span><span id="maxLbl"></span></div>
      <div class="note">High-resolution vector boundaries</div>
    </div>
  </div>
</div>
<script>// https://d3js.org v7.9.0 Copyright 2010-2023 Mike Bostock

function stCount(name){const ab=name2ab[name];return ab?(counts[ab]||0):0;}

// states + provinces
const gStates=gLayer.append('g');
gStates.selectAll('path').data(RENDER.features).join('path')
  .attr('class','state').attr('d',path)
  .attr('fill',d=>{const c=stCount(d.properties.name);return c?color(c):'#161c27';});

// crisp national border accent
gLayer.append('path').datum(usMesh).attr('class','natborder').attr('d',path);

// labels for office-bearing states/provinces
const gLab=gLayer.append('g');
const labelFeats=RENDER.features.filter(f=>stCount(f.properties.name)>0);
gLab.selectAll('text').data(labelFeats).join('text')
  .attr('class','slabel').attr('font-size','9px')
  .attr('transform',d=>{const c=path.centroid(d);return `translate(${c[0]},${c[1]})`;})
  .text(d=>name2ab[d.properties.name]||'');

// offices
const gPts=gLayer.append('g');
const proj=OFFICES.map(o=>{const p=projection([o.lon,o.lat]);return{o,x:p?p[0]:null,y:p?p[1]:null};});
const circles=gPts.selectAll('circle').data(proj.filter(d=>d.x!=null)).join('circle')
  .attr('class','office').attr('r',4.2).attr('cx',d=>d.x).attr('cy',d=>d.y)
  .on('mouseenter',(e,d)=>{tip.textContent=d.o.n+' — '+d.o.c+', '+d.o.s;const r=wrap.getBoundingClientRect();tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.style.opacity=1;})
  .on('mousemove',(e)=>{const r=wrap.getBoundingClientRect();tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';})
  .on('mouseleave',()=>tip.style.opacity=0)
  .on('click',(e,d)=>{e.stopPropagation();selectOffice(OFFICES.indexOf(d.o));});

const zoom=d3.zoom().scaleExtent([1,60]).on('zoom',ev=>{
  gLayer.attr('transform',ev.transform);const k=ev.transform.k;
  gPts.selectAll('circle').attr('r',4.2/Math.sqrt(k));
  gLab.selectAll('text').attr('font-size',(9/Math.sqrt(k))+'px');
});
svg.call(zoom).on('dblclick.zoom',null);
svg.on('click',hideDetail);

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function detailHTML(o){
  let h=`<span class="x" id="dx">&times;</span><div class="pop-name">${esc(o.n)}</div>`;
  if(o.id) h+=`<div class="pop-id">${esc(o.id)}</div>`;
  h+=`<div class="pop-row"><span class="lbl">Addr</span><span>${esc(o.a)}<br>${esc(o.c)}, ${esc(o.s)} ${esc(o.z)}</span></div>`;
  if(o.k) h+=`<div class="pop-row"><span class="lbl">Contact</span><span>${esc(o.k)}</span></div>`;
  if(o.p) h+=`<div class="pop-row"><span class="lbl">Phone</span><a href="tel:${esc(o.p)}">${esc(o.p)}</a></div>`;
  if(o.e) h+=`<div class="pop-row"><span class="lbl">Email</span><a href="mailto:${esc(o.e)}">${esc(o.e)}</a></div>`;
  if(o.sv) h+=`<div class="pop-row"><span class="lbl">Modes</span><span>${esc(o.sv)}</span></div>`;
  const dir=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent((o.a?o.a+', ':'')+o.c+', '+o.s+' '+o.z)}`;
  h+=`<div class="pop-row" style="margin-top:10px"><a href="${dir}" target="_blank" rel="noopener" style="font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.5px">&#8599; DIRECTIONS</a></div>`;
  if(o.g==='zip') h+=`<div class="approx">&#9888; Approx. location (ZIP centroid)</div>`;
  h+=`<div class="analytics"><div class="an-hdr">Carrier Analytics</div><div class="an-loading" id="an-body">Loading…</div></div>`;
  return h;
}
function showDetail(o){detail.innerHTML=detailHTML(o);detail.classList.add('show');document.getElementById('dx').onclick=hideDetail;fetchStats(o);}
function hideDetail(){detail.classList.remove('show');circles.classed('sel',false);gStates.selectAll('path').classed('hl',false);document.querySelectorAll('.item.active').forEach(e=>e.classList.remove('active'));}
function selectOffice(i,listItem){
  const o=OFFICES[i],p=projection([o.lon,o.lat]);if(!p)return;
  circles.classed('sel',d=>d.o===o);
  gStates.selectAll('path').classed('hl',d=>name2ab[d.properties.name]===o.s);
  showDetail(o);
  document.querySelectorAll('.item.active').forEach(e=>e.classList.remove('active'));
  if(listItem)listItem.classList.add('active');
  else{const li=document.querySelector(`.item[data-i="${i}"]`);if(li){li.classList.add('active');li.scrollIntoView({block:'nearest'});}}
  svg.transition().duration(650).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(11).translate(-p[0],-p[1]));
  if(window.innerWidth<=820)document.getElementById('side').classList.remove('open');
}

const sel=document.getElementById('state');
[...new Set(OFFICES.map(o=>o.s).filter(Boolean))].sort().forEach(s=>{const op=document.createElement('option');op.value=s;op.textContent=`${s}  (${counts[s]||0})`;sel.appendChild(op);});
let activeState='',query='',activeModes=new Set();
const listEl=document.getElementById('list');
function visible(){return OFFICES.map((o,i)=>({o,i})).filter(({o})=>{
  if(activeState&&o.s!==activeState)return false;
  if(activeModes.size){for(const m of activeModes){if(!o.m.includes(m))return false;}}
  if(query){const h=(o.n+' '+o.id+' '+o.c+' '+o.s+' '+o.z+' '+o.k+' '+o.sv).toLowerCase();if(!h.includes(query))return false;}
  return true;});}
function render(){
  const vis=visible(),okset=new Set(vis.map(v=>v.o));
  circles.attr('display',d=>okset.has(d.o)?null:'none');
  document.getElementById('cShown').textContent=vis.length;
  listEl.innerHTML='';
  if(!vis.length){listEl.innerHTML='<div class="empty">No offices match your filters.</div>';return;}
  const frag=document.createDocumentFragment();
  vis.forEach(({o,i})=>{const d=document.createElement('div');d.className='item';d.dataset.i=i;
    const modes=(o.m||[]).map(m=>`<span class="mtag">${m}</span>`).join('');
    d.innerHTML=`<span class="pin"></span><div class="it-main"><div class="it-name">${esc(o.n)}</div><div class="it-sub">${esc(o.c)}, ${esc(o.s)} &middot; ${esc(o.z)}</div>${modes?`<div class="it-modes">${modes}</div>`:''}</div>`;
    d.onclick=()=>selectOffice(i,d);frag.appendChild(d);});
  listEl.appendChild(frag);
}
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render();});
sel.addEventListener('change',e=>{activeState=e.target.value;render();
  if(activeState){const f=RENDER.features.find(x=>name2ab[x.properties.name]===activeState);
    if(f){const b=path.bounds(f),dx=b[1][0]-b[0][0],dy=b[1][1]-b[0][1],cx=(b[0][0]+b[1][0])/2,cy=(b[0][1]+b[1][1])/2;
      const k=Math.min(60,.82/Math.max(dx/W,dy/H));
      svg.transition().duration(650).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-cx,-cy));}}
});
document.getElementById('modes').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const m=b.dataset.m;
  if(activeModes.has(m)){activeModes.delete(m);b.classList.remove('on');}else{activeModes.add(m);b.classList.add('on');}render();});
function clearFilters(){query='';activeState='';activeModes.clear();document.getElementById('q').value='';sel.value='';document.querySelectorAll('#modes .chip').forEach(c=>c.classList.remove('on'));render();}
document.getElementById('reset2').onclick=()=>clearFilters();
document.getElementById('reset').onclick=()=>{clearFilters();hideDetail();svg.transition().duration(650).call(zoom.transform,d3.zoomIdentity);};
document.getElementById('zin').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.6);
document.getElementById('zout').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.6);
document.getElementById('csv').onclick=()=>{const vis=visible().map(v=>v.o);const cols=['Office','ID','Address','City','State','ZIP','Phone','Email','Contacts','Services'];
  const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
  const rows=[cols.join(',')].concat(vis.map(o=>[o.n,o.id,o.a,o.c,o.s,o.z,o.p,o.e,o.k,o.sv].map(q).join(',')));
  const blob=new Blob([rows.join('\r\n')],{type:'text/csv'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MODE_offices_filtered.csv';a.click();URL.revokeObjectURL(url);};
const sw=document.getElementById('scaleSw');for(let i=0;i<=6;i++){const d=document.createElement('div');d.className='sw';d.style.background=color(maxC*i/6);sw.appendChild(d);}
document.getElementById('maxLbl').textContent=maxC;
window.addEventListener('resize',()=>{fitProjection();
  gStates.selectAll('path').attr('d',path);
  gLayer.select('.natborder').attr('d',path);
  gLab.selectAll('text').attr('transform',d=>{const c=path.centroid(d);return `translate(${c[0]},${c[1]})`;});
  circles.attr('cx',d=>{const p=projection([d.o.lon,d.o.lat]);return p?p[0]:null;}).attr('cy',d=>{const p=projection([d.o.lon,d.o.lat]);return p?p[1]:null;});
});
document.getElementById('cTotal').textContent=OFFICES.length;
render();

async function fetchStats(o){
  const el=()=>document.getElementById('an-body');
  const id=o.id||o.n;
  if(!id){const e=el();if(e){e.className='an-empty';e.textContent='No office ID to look up.';} return;}
  try{
    const r=await fetch('/api/office-stats/'+encodeURIComponent(id));
    const panel=el();if(!panel)return;
    if(r.status===404){panel.className='an-empty';panel.textContent='No analytics data for this office yet.';return;}
    if(!r.ok){panel.className='an-err';panel.textContent='Error loading analytics.';return;}
    const d=await r.json();
    let primaryVal,primaryLbl,primaryClass;
    if(d.avg_profit_pct!=null){
      primaryVal=d.avg_profit_pct+'%';
      primaryLbl='Profit Margin';
      primaryClass=d.avg_profit_pct>=20?'good':d.avg_profit_pct>=12?'warn':'bad';
    }else{
      primaryVal=d.match_rate+'%';
      primaryLbl='Match Rate';
      primaryClass=d.match_rate>=80?'good':d.match_rate>=60?'warn':'bad';
    }
    let h=`<div class="an-kpis">
      <div class="an-kpi"><span class="an-kpi-val ${primaryClass}">${primaryVal}</span><span class="an-kpi-lbl">${primaryLbl}</span></div>
      <div class="an-kpi"><span class="an-kpi-val">${(d.total||0).toLocaleString()}</span><span class="an-kpi-lbl">Loads</span></div>
      <div class="an-kpi"><span class="an-kpi-val">${d.avg_rate?'$'+(d.avg_rate).toLocaleString():'—'}</span><span class="an-kpi-lbl">Avg Revenue</span></div>
    </div>`;
    if(d.top_lanes&&d.top_lanes.length){
      h+=`<div class="an-lanes-hdr">Top Lanes</div>`;
      d.top_lanes.slice(0,5).forEach(function(lane){
        h+=`<div class="an-lane"><span>${esc(lane.orig)}→${esc(lane.dest)}</span><span class="an-lane-cnt">${lane.count}</span></div>`;
      });
    }
    if(d.monthly_trend&&d.monthly_trend.length){
      const months=d.monthly_trend.slice(-6);
      const maxT=Math.max.apply(null,months.map(function(m){return m.count;}).concat([1]));
      const W=180,H=36,pad=4;
      const step=(W-pad*2)/(months.length-1||1);
      const pts=months.map(function(m,i){
        const x=pad+i*step;
        const y=H-pad-(m.count/maxT)*(H-pad*2);
        return x+','+y;
      }).join(' ');
      const dotPts=months.map(function(m,i){
        const x=pad+i*step;
        const y=H-pad-(m.count/maxT)*(H-pad*2);
        return '<circle cx="'+x+'" cy="'+y+'" r="2.5" fill="var(--accent)" opacity=".85"><title>'+esc(m.month)+': '+m.count+' loads</title></circle>';
      }).join('');
      h+=`<div class="an-sparkline" title="Monthly load volume (last ${months.length} months)">
        <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
          <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round" opacity=".6"/>
          ${dotPts}
        </svg>
      </div>`;
    }
    const panel2=el();if(panel2)panel2.outerHTML=h;
  }catch(err){
    const panel=el();if(panel){panel.className='an-err';panel.textContent='Analytics unavailable.';}
  }
}

const gWarnDots=gLayer.append('g');
(async function(){
  try{
    const r=await fetch('/api/office-stats');
    if(!r.ok)return;
    const data=await r.json();
    const offices=data.offices||data;
    if(!Object.keys(offices).length)return;
    const proj2=OFFICES.map(function(o){const p=projection([o.lon,o.lat]);return{o:o,x:p?p[0]:null,y:p?p[1]:null};});
    proj2.forEach(function(pt){
      if(pt.x==null)return;
      const s=offices[pt.o.id]||offices[pt.o.n];
      if(!s)return;
      const warn=s.avg_profit_pct!=null?s.avg_profit_pct<12:s.match_rate<70;
      if(!warn)return;
      gWarnDots.append('circle')
        .attr('class','warn-dot')
        .attr('cx',pt.x+3).attr('cy',pt.y-3)
        .attr('r',2.2).attr('fill','#facc15')
        .attr('stroke','#0e1116').attr('stroke-width','1px');
    });
  }catch(e){}
})();
</script>
